<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración | SneakersCol</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #181818;
      font-family: Arial, sans-serif;
      color: white;
    }

    .login {
      width: 90%;
      max-width: 400px;
      background: #222;
      padding: 35px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitulo {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 7px;
      border: 1px solid #555;
      background: #111;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #29c900;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }

    #mensaje {
      margin-top: 18px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="login">
    <h1>SNEAKERS COL</h1>
    <div class="subtitulo">Panel de administración</div>

    <label for="email">Correo electrónico</label>
    <input id="email" type="email" autocomplete="username">

    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password">

    <button onclick="iniciarSesion()">INICIAR SESIÓN</button>

    <div id="mensaje"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://mqkghtubwpsjvoivynhr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_GwPXab6AhFFXVKr-mfobAw_98C6wFIW";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function iniciarSesion() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const mensaje = document.getElementById("mensaje");

      mensaje.textContent = "Ingresando...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        mensaje.textContent = "Correo o contraseña incorrectos.";
        return;
      }

      mensaje.textContent = "Inicio de sesión correcto.";
    }
  </script>

</body>
</html>
