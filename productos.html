<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos | SneakersCol</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px 30px;
      border-bottom: 2px solid #7CFF00;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logo span {
      color: #7CFF00;
    }

    .volver {
      background: #7CFF00;
      color: #111;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
    }

    main {
      width: min(1100px, 92%);
      margin: 35px auto;
    }

    .titulo {
      margin-bottom: 25px;
    }

    .titulo h1 {
      margin-bottom: 8px;
    }

    .titulo p {
      color: #bbb;
    }

    .acciones {
      margin-bottom: 25px;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 12px 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .nuevo {
      background: #7CFF00;
      color: #111;
    }

    .editar {
      background: white;
      color: #111;
    }

    .contenedor {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 20px;
      overflow-x: auto;
    }

    .estado {
      color: #7CFF00;
      margin-bottom: 15px;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 13px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    th {
      color: #7CFF00;
    }

    td small {
      color: #ddd;
    }

    .vacio {
      color: #bbb;
      text-align: center;
      padding: 30px;
    }

    @media (max-width: 700px) {
      header {
        padding: 15px;
      }

      .logo {
        font-size: 18px;
      }

      .volver {
        padding: 9px 12px;
        font-size: 12px;
      }

      main {
        width: 94%;
        margin: 25px auto;
      }

      th,
      td {
        padding: 10px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    SNEAKERS <span>COL</span>
  </div>

  <a class="volver" href="panel.html">
    VOLVER AL PANEL
  </a>
</header>

<main>

  <div class="titulo">
    <h1>Productos</h1>
    <p>Administra el catálogo de SneakersCol.</p>
  </div>

  <div class="acciones">
    <button
      class="nuevo"
      type="button"
      onclick="nuevoProducto()"
    >
      + AGREGAR PRODUCTO
    </button>
  </div>

  <div class="contenedor">

    <div class="estado">
      ● Sistema conectado
    </div>

    <table>

      <thead>
        <tr>
          <th>Producto</th>
          <th>Precio</th>
          <th>Inventario</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody id="listaProductos">
        <tr>
          <td colspan="4" class="vacio">
            Preparando catálogo de productos...
          </td>
        </tr>
      </tbody>

    </table>

  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://mqkghtubwpsjvoivynhr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_GwPXab6AhFFXVKr-mfobAw_98C6wFIW";


const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   UTILIDADES
========================= */

function dinero(valor) {
  return "$" + Number(valor || 0).toLocaleString("es-CO");
}


function limpiarTexto(texto) {
  const div = document.createElement("div");
  div.textContent = texto ?? "";
  return div.innerHTML;
}


/* =========================
   VERIFICAR SESIÓN
========================= */

async function verificarSesion() {

  const { data, error } =
    await supabaseClient.auth.getSession();

  if (error) {
    console.error(
      "Error verificando la sesión:",
      error
    );
  }

  if (!data || !data.session) {
    window.location.href = "admin.html";
    return false;
  }

  return true;
}


/* =========================
   CARGAR PRODUCTOS
========================= */

async function cargarProductos() {

  const sesionCorrecta =
    await verificarSesion();

  if (!sesionCorrecta) {
    return;
  }


  const lista =
    document.getElementById("listaProductos");


  lista.innerHTML = `
    <tr>
      <td colspan="4" class="vacio">
        Cargando productos...
      </td>
    </tr>
  `;


  const { data, error } =
    await supabaseClient
      .from("productos")
      .select("id,nombre,precio,tallas,disponible")
      .order("id", { ascending: true });


  if (error) {

    console.error(
      "Error cargando productos:",
      error
    );

    lista.innerHTML = `
      <tr>
        <td colspan="4" class="vacio">
          Error cargando los productos.
        </td>
      </tr>
    `;

    return;
  }


  if (!data || data.length === 0) {

    lista.innerHTML = `
      <tr>
        <td colspan="4" class="vacio">
          No hay productos registrados todavía.
        </td>
      </tr>
    `;

    return;
  }


  lista.innerHTML =
    data.map(producto => {

      const estado =
        producto.disponible === false
          ? "No disponible"
          : "Disponible";


      return `
        <tr>

          <td>
            ${limpiarTexto(producto.nombre)}
          </td>

          <td>
            ${dinero(producto.precio)}
          </td>

          <td>
            ${limpiarTexto(
              producto.tallas || "Sin tallas"
            )}

            <br>

            <small>
              ${estado}
            </small>
          </td>

          <td>
            <button
              class="editar"
              type="button"
              onclick="editarProducto('${producto.id}')"
            >
              EDITAR
            </button>
          </td>

        </tr>
      `;

    }).join("");
}


/* =========================
   EDITAR PRODUCTO
========================= */

function editarProducto(id) {

  window.location.href =
    editar-producto.html?id=${encodeURIComponent(id)};
}


/* =========================
   NUEVO PRODUCTO
========================= */

function nuevoProducto() {

  window.location.href =
    "editar-producto.html";
}


/* =========================
   INICIAR
========================= */

document.addEventListener(
  "DOMContentLoaded",
  cargarProductos
);

</script>

</body>
</html>
